kind = "mobile"
previewPath = "/"
title = "Chkobba & Rami"
description = "An Android-first Tunisian multiplayer card game for Chkobba and Rami, built for human-only online play with server-authoritative rules, Arabic/French/English support, and private rooms."
version = "1.0.0"
id = "artifacts/tunisian-cards"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 20396

[services.development]
run = "pnpm --filter @workspace/tunisian-cards run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tunisian-cards", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/tunisian-cards", "run", "serve" ]

[services.env]
PORT = "20396"
BASE_PATH = "/"
